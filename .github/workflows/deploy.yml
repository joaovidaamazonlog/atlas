name: Deploy ATLAS React to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atlas-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: atlas-react

      - name: Copy data files
        run: |
          cp -r output_data atlas-react/public/output_data
          cp -r config atlas-react/public/config

      - name: Build
        run: npm run build
        working-directory: atlas-react

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: atlas-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
