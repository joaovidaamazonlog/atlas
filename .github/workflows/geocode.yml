name: Geocode Empresas

on:
  workflow_dispatch:
    inputs:
      no_resume:
        description: 'Reprocessar tudo? (true/false)'
        required: false
        default: 'false'

jobs:
  geocode:
    name: Worker ${{ matrix.worker_id }} (${{ matrix.ufs }})
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - worker_id: "GA1"
            ufs: "RJ ES"
          - worker_id: "GA2"
            ufs: "RS SC"
          - worker_id: "GA3"
            ufs: "PR MS MT"
          - worker_id: "GA4"
            ufs: "BA GO DF"
          - worker_id: "GA5"
            ufs: "PA CE PE MA AM RN PB PI AL SE RO TO AC AP RR"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests h3

      - name: Run geocode worker ${{ matrix.worker_id }}
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_resume }}" = "true" ]; then
            EXTRA="--no-resume"
          fi
          UF_ARGS=""
          for uf in ${{ matrix.ufs }}; do
            UF_ARGS="$UF_ARGS --uf $uf"
          done
          python geocode_worker.py --worker-id ${{ matrix.worker_id }} $UF_ARGS $EXTRA
        working-directory: _api_backend

      - name: Progress report
        if: always()
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: python progress_report.py
        working-directory: _api_backend

  summary:
    name: Resumo Global
    runs-on: ubuntu-latest
    needs: geocode
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Global progress summary
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: python progress_report.py --by-uf
        working-directory: _api_backend
