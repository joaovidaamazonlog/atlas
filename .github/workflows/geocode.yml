name: Geocode Empresas

on:
  workflow_dispatch:
    inputs:
      no_resume:
        description: 'Reprocessar tudo? (true/false)'
        required: false
        default: 'false'

jobs:
  geocode:
    name: Worker ${{ matrix.worker_id }} (CEP ${{ matrix.cep_min }}-${{ matrix.cep_max }})
    runs-on: ubuntu-latest
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - worker_id: "GA1"
            cep_min: "00000000"
            cep_max: "09999999"
          - worker_id: "GA2"
            cep_min: "10000000"
            cep_max: "19999999"
          - worker_id: "GA3"
            cep_min: "20000000"
            cep_max: "29999999"
          - worker_id: "GA4"
            cep_min: "30000000"
            cep_max: "39999999"
          - worker_id: "GA5"
            cep_min: "40000000"
            cep_max: "49999999"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install requests h3

      - name: Run geocode worker ${{ matrix.worker_id }}
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.no_resume }}" = "true" ]; then
            EXTRA="--no-resume"
          fi
          python geocode_worker.py \
            --worker-id ${{ matrix.worker_id }} \
            --cep-min   ${{ matrix.cep_min }} \
            --cep-max   ${{ matrix.cep_max }} \
            $EXTRA
        working-directory: _api_backend

      - name: Progress report
        if: always()
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: python progress_report.py
        working-directory: _api_backend

  summary:
    name: Resumo Global
    runs-on: ubuntu-latest
    needs: geocode
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Global progress summary
        env:
          TURSO_URL:   ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_TOKEN }}
        run: python progress_report.py --by-uf
        working-directory: _api_backend
