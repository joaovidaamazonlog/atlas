name: Google Maps Scraper

on:
  # Roda todo dia às 6h (horário de Brasília = 9h UTC)
  schedule:
    - cron: '0 9 * * *'
  # Permite rodar manualmente pelo GitHub Actions UI
  workflow_dispatch:
    inputs:
      stations:
        description: 'Filtrar bases (ex: DSP2 DBH5). Deixe vazio para todas.'
        required: false
        default: ''
        
permissions:
  contents: write
  
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 horas de limite

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: gmaps-scraper
        run: npm install

      - name: Rodar scraper
        working-directory: gmaps-scraper
        run: |
          if [ -n "${{ github.event.inputs.stations }}" ]; then
            node run_batch.js --stations ${{ github.event.inputs.stations }}
          else
            node run_batch.js
          fi
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'false'
          
      - name: Commit e push do resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gmaps_results.json
          git diff --staged --quiet || git commit -m "chore: atualiza gmaps_results.json [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
