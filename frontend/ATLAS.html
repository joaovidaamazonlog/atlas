<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ATLAS - Analytical Tracking for Location and Store performance</title>
        <link rel="icon" href="icons/hub.png">

        <!-- Bibliotecas CSS Externas -->
        <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.polyline.measure/Leaflet.Polyline.Measure.css" />
        <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@5.4.3/dist/css/tabulator.min.css">
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <!-- CSS local -->
        <link rel="stylesheet" href="css/app.css">
        <link rel="stylesheet" href="css/stats-panel.css">
        <link rel="stylesheet" href="css/dashboard.css">
    </head>
    <body>
        <div id="app-container">
            <!-- CABEÇALHO FIXO -->
            <div class="header">
                <!-- Esquerda -->
                <div class="left">
                    <img class="logo" src="icons/AmazonHub.ico" alt="Amazon Hub Logo">
                </div>

                <!-- Centro -->
                <div class="center">
                    <p>ATLAS - Analytical Tracking for Location and Store performance</p>
                    <p class="author">Created by: joaovida@</p>
                    <p class="period-info" id="periodInfo">Carregue um arquivo JSON para começar</p>
                </div>

                <!-- Direita -->
                <div class="right">
                    <img class="logo" src="icons/AmazonHub.ico" alt="Amazon Hub Logo" style="display:none">
                </div>
            </div>
            <!-- WRAPPER DO MAPA E PAINÉIS -->
            <div id="map-wrapper">
                <div id="map"></div>
                
                <!-- Container para todos os painéis flutuantes -->
                <div class="leaflet-control-container">
                    <div class="leaflet-top leaflet-left">
                        <div class="leaflet-control">
                            <!-- Barra de Pesquisa -->
                            <div class="floating-panel" id="search-panel">
                                <div id="search-container">
                                    <form class= "form-search" onsubmit="event.preventDefault(); UIManager.searchPartner();">
                                        <input type="text" class="form-control form-control-sm" id="search-input" placeholder="Pesquisar...">
                                    </form>
                                    <div class="btn-search">
                                        <button class="btn btn-primary btn-sm" id="search-btn" onclick="UIManager.searchPartner()"><i class="fa fa-search"></i></button>
                                    </div>
                                </div>
                            </div>

                            <!-- Painel de Estilização -->
                            <div class="floating-panel" id="styleField-panel">
                                <div class="panel-header" onclick="togglePanelContent(this)">
                                    <h5><i class="fas fa-palette"></i> Estilizar por</h5>
                                    <i class="fas fa-chevron-down"></i>
                                </div>
                                <div class="panel-content">
                                    <!-- Novo: Dois selects para estilização por dois parâmetros -->
                                    <div class="form-group">
                                        <label for="primaryStyle">Estilizar por:</label>
                                        <select id="primaryStyle" class="form-control form-control-sm" onchange="MapManager.restyleMarkers()">
                                            <option value="delivery_station" selected>Delivery Station</option>
                                            <option value="status">Status</option>
                                            <option value="hub_delivey_initiatives">Hub Delivery Initiatives</option>
                                            <option value="supply_run">Supply Run</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label for="secondaryStyle">Detalhar por:</label>
                                        <select id="secondaryStyle" class="form-control form-control-sm" onchange="MapManager.restyleMarkers()">
                                            <option value="" selected>Nenhum</option>
                                            <option value="delivery_station">Delivery Station</option>
                                            <option value="status">Status</option>
                                            <option value="hub_delivey_initiatives">Hub Delivery Initiatives</option>
                                            <option value="supply_run">Supply Run</option>
                                            <option value="bucket_ade">Carteira</option>
                                        </select>
                                    </div>
                                    <hr>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="showRadii" onchange="MapManager.toggleRadii()"><label class="form-check-label">Exibir Raios</label></div>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="showPolygons" onchange="PolygonManager.togglePolygons()"><label class="form-check-label">Exibir Ares de Prospecção</label></div>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="showJurisdictions" onchange="PolygonManager.toggleJurisdictons()"><label class="form-check-label">Exibir Jurisdições</label></div>
                                    <div class="form-check"><input class="form-check-input" type="checkbox" id="showOptimizationLayer" onchange="PolygonManager.toggleOptimizationLayer()"><label class="form-check-label">Exibir Camada de Otimização</label></div>
                                </div>
                            </div>

                            <!-- Painel de Abas: Filtros, Destaques, Rotas -->
                            <div class="floating-panel" id="controls-panel">
                                <ul class="nav nav-tabs" id="controlTabs" role="tablist">
                                    <li class="nav-item"><a class="nav-link active" data-toggle="tab" href="#filter-content"><i class="fas fa-filter"></i> Filtros</a></li>
                                    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#highlight-content"><i class="fas fa-map-marked-alt"></i> Análise de Área</a></li>
                                    <li class="nav-item"><a class="nav-link" data-toggle="tab" href="#route-content"><i class="fas fa-route"></i> Rotas</a></li>
                                </ul>
                                <div class="tab-content mt-3">
                                    <!-- Aba de Filtros -->
                                    <div class="tab-pane fade show active" id="filter-content" role="tabpanel">
                                        <div class="collumns">
                                            <div class="row">
                                                <div class="col-6 pl-1"><div class="form-group"><label for="statusFilter">Status:</label><select class="form-control form-control-sm" id="statusFilter" multiple><option value="all" >Todos</option><option value="Active" selected>Active</option><option value="Onboarding" selected>Onboarding</option><option value="BG Checks" selected>Vetting</option><option value="Prospect">Prospect</option><option value="Inactive">Inactive</option><option value="New">Pontos de interesse</option></select></div></div>
                                                <div class="col-6 pl-1"><div class="form-group"><label for="stationFilter">Delivery Station:</label><select class="form-control form-control-sm" id="stationFilter" multiple><option value="all" selected>Todos</option></select></div></div>
                                            </div>
                                        </div>
                                        <div class="collumns">
                                            <div class="row">
                                                <div class="col-6 pl-1"><div class="form-group"><label for="bucket_ade">Carteira ADE:</label><select class="form-control form-control-sm" id="bucket_ade" multiple><option value="all" selected>Todos</option></select></div></div>
                                                <div class="col-6 pr-1"><div class="form-group"><label for="initiativesFilter">Delivery Initiatives:</label><select class="form-control form-control-sm" id="initiativesFilter"><option value="all" selected>Todos</option></select></div></div>
                                                <div class="col-6 pr-1"><div class="form-group"><label for="jurisdictionFilter">Jurisdiction Type:</label><select class="form-control form-control-sm" id="jurisdictionFilter"><option value="all">Todos</option><option value="Exclusive">Exclusive</option><option value="Shared">Shared</option></select></div></div>
                                        
                                            </div>
                                        </div>
                                        <button class="btn btn-primary btn-sm btn-block" onclick="DataManager.applyFilters()">Aplicar Filtros</button>
                                        <button class="btn btn-secondary btn-sm btn-block" onclick="DataManager.resetFilters()">Limpar Filtros</button>
                                    </div>
                                    <!-- Aba de Análise de Área -->
                                    <div class="tab-pane fade" id="highlight-content" role="tabpanel">
                                        <p class="text-muted small mb-2">
                                          <i class="fas fa-lock"></i> Filtro fixo: Status = Prospect
                                        </p>
                                        <div class="form-group">
                                          <label for="areaStateFilter">Estado:</label>
                                          <select class="form-control form-control-sm" id="areaStateFilter"></select>
                                        </div>
                                        <div class="form-group">
                                          <label for="areaDecisionFilter">Decisão:</label>
                                          <select class="form-control form-control-sm" id="areaDecisionFilter">
                                            <option value="all" selected>Todos</option>
                                            <option value="Go">Go</option>
                                            <option value="No Go">No Go</option>
                                          </select>
                                        </div>
                                        <button class="btn btn-primary btn-sm btn-block" id="analyseAreaBtn"
                                                onclick="UIManager.analyseArea()">
                                          <i class="fas fa-chart-pie"></i> Analisar Área
                                        </button>
                                    </div>
                                    <!-- Aba de Rotas -->
                                    <div class="tab-pane fade" id="route-content" role="tabpanel">
                                        <div class="form-group">
                                            <label for="routeFromInput">De:</label>
                                            <input type="text" id="routeFromInput" class="form-control form-control-sm" placeholder="Pesquisar parceiro de origem...">
                                            <input type="hidden" id="routeFromId">
                                        </div>
                                        <div class="form-group">
                                            <label for="routeToInput">Para:</label>
                                            <input type="text" id="routeToInput" class="form-control form-control-sm" placeholder="Pesquisar parceiro de destino...">
                                            <input type="hidden" id="routeToId">
                                        </div>
                                        <button class="btn btn-info btn-sm btn-block" id="addStopBtn" onclick="RouteManager.addStop()">
                                            <i class="fas fa-plus"></i> Add Parada
                                        </button>
                                        <div id="stops-list" class="mt-2">
                                            <!-- A lista de paradas será renderizada aqui via JS -->
                                        </div>
                                        <button class="btn btn-success btn-sm btn-block" onclick="RouteManager.generateRoute()">
                                            <i class="fas fa-map-signs"></i> Buscar Melhor Rota
                                        </button>
                                        <button id="suggest-routes-btn" class="btn btn-warning btn-block" onclick="RouteManager.hcpSuggestHostClusters()" style="display:none;">Sugerir HCP Initiatives</button>
                                        <button class="btn btn-secondary btn-sm btn-block" onclick="RouteManager.clearRoute()">
                                            <i class="fas fa-times-circle"></i> Limpar Rota
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
        <!-- Botão para abrir o Dashboard -->
        <div id="stats-toggle-button" class="floating-button">
            <i class="fas fa-chart-bar"></i>
            <span>Dashboard</span>
        </div>

        <!-- Dashboard (inicialmente oculto) -->
        <div id="stats-panel" class="floating-panel-statistics">
            <!-- Cabeçalho do dashboard com botão de fechar -->
            <div class="panel-header-statistics">
                <h3>Dashboard - hub delivery Brasil</h3>
                <button id="close-stats-panel" class="close-button">&times;</button>
            </div>
            <!-- Dashboard Gerencial -->
            <div class="floating-panel" id="stats-inner-panel">
                <div id="management-dashboard-root"></div>
            </div>
        </div>
        <!-- Container para o autocomplete (fora do fluxo normal) -->
        <div id="autocomplete-results" class="list-group"></div>

        <!-- Bibliotecas JS Externas -->
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
        <script src="https://unpkg.com/leaflet-control-geocoder@2.3.0/dist/Control.Geocoder.js"></script>
        <script src="https://unpkg.com/leaflet.polyline.measure/Leaflet.Polyline.Measure.js"></script>
        <script type="text/javascript" src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
        <script src="https://unpkg.com/leaflet-icon-glyph/dist/Leaflet.Icon.Glyph.js"></script>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="js/main.js"></script>

    </body>
</html>
